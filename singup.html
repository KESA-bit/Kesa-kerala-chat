<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KESA - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: #000000; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: '-apple-system', BlinkMacSystemFont, sans-serif;
        }
        .signup-container { 
            width: 90%; 
            max-width: 340px; 
            padding: 35px 20px; 
            background: #1c1c1e; 
            border-radius: 18px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { 
            font-size: 26px; 
            font-weight: 800; 
            margin-bottom: 25px; 
            color: #ffffff; 
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
            width: 100%;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e93;
            font-size: 16px;
        }
        .input-group input { 
            width: 100%; 
            padding: 12px 12px 12px 45px; 
            background: #2c2c2e; 
            border: 1px solid #3a3a3c; 
            color: #ffffff; 
            border-radius: 10px; 
            outline: none; 
            font-size: 15px;
            box-sizing: border-box;
        }
        .premium-btn { 
            width: 100%; 
            padding: 12px; 
            background: #ff6f00; 
            color: #000000; 
            font-weight: 800; 
            font-size: 16px;
            border-radius: 10px; 
            cursor: pointer; 
            border: none;
            margin-top: 10px;
            text-align: center;
            box-sizing: border-box;
        }
        .login-link-box {
            margin-top: 20px;
            font-size: 14px;
            color: #8e8e93;
        }
        .login-link-box a {
            color: #ff6f00;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Create Account</h2>
        
        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="signup-email" placeholder="Email">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="signup-password" placeholder="Password">
        </div>

        <div class="premium-btn" id="signup-btn">Sign Up</div>

        <div class="login-link-box">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
